<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5" />
      <stop offset="100%" stop-color="#E5D5C0" />
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Base Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" />
  
  <!-- Animated Light Beams -->
  <path d="M -100 0 L 200 600 L 400 600 L 100 0 Z" fill="#ffffff" opacity="0.2">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="8s" repeatCount="indefinite" />
    <animate attributeName="d" values="M -100 0 L 200 600 L 400 600 L 100 0 Z; M 0 0 L 300 600 L 500 600 L 200 0 Z; M -100 0 L 200 600 L 400 600 L 100 0 Z" dur="15s" repeatCount="indefinite" />
  </path>
  
  <path d="M 300 0 L 600 600 L 800 600 L 500 0 Z" fill="#ffffff" opacity="0.15">
    <animate attributeName="opacity" values="0.05;0.2;0.05" dur="10s" repeatCount="indefinite" />
  </path>

  <!-- Abstract Geometric Luxury Elements -->
  <circle cx="400" cy="300" r="150" fill="none" stroke="#C5A880" stroke-width="2" opacity="0.5">
    <animateTransform attributeName="transform" type="scale" values="1;1.05;1" dur="10s" repeatCount="indefinite" additive="sum" />
  </circle>
  <circle cx="400" cy="300" r="120" fill="none" stroke="#C5A880" stroke-width="1" opacity="0.3" stroke-dasharray="10 5">
    <animateTransform attributeName="transform" type="rotate" from="0 400 300" to="360 400 300" dur="60s" repeatCount="indefinite" />
  </circle>
  
  <!-- Central Emblem -->
  <path d="M 380 270 L 420 270 L 400 240 Z" fill="#C5A880" filter="url(#softGlow)">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="4s" repeatCount="indefinite" />
  </path>
  <rect x="390" y="275" width="20" height="40" fill="#C5A880" opacity="0.8" />
  <path d="M 370 320 L 430 320 L 400 350 Z" fill="#C5A880" filter="url(#softGlow)">
     <animateTransform attributeName="transform" type="translate" values="0 0; 0 5; 0 0" dur="4s" repeatCount="indefinite" />
  </path>
</svg>
